{{template "header" .}}
<div class="page-head">
  <div>
    <h1>账号管理</h1>
    <p class="muted small">添加账号后系统会在定时任务中自动查询话费与套餐用量</p>
  </div>
  <div class="page-actions">
    <button class="btn primary" id="queryAllBtn" onclick="queryAll()">立即查询全部</button>
    <button class="btn" onclick="openAddModal()">添加账号</button>
  </div>
</div>

<div id="queryBanner" class="alert info" style="display:none"></div>
<div id="pageError" class="alert error" style="display:none"></div>

<div id="emptyTip" class="card" style="display:none;text-align:center">
  <p class="muted">还没有账号</p>
  <p class="muted small">点击右上角「添加账号」，输入手机号并完成短信验证码登录</p>
</div>

<div class="card table-card" id="listCard" style="display:none">
  <div class="table-wrap">
    <table class="table acc-table">
      <thead>
        <tr>
          <th>备注</th>
          <th>手机号码</th>
          <th>状态</th>
          <th>余额</th>
          <th>通用流量</th>
          <th>语音</th>
          <th>查询时间</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="accBody"></tbody>
    </table>
  </div>
</div>

<!-- 添加账号弹窗（登录流程） -->
<div class="modal-mask" id="addModal" style="display:none">
  <div class="modal">
    <h3>添加账号</h3>
    <div id="addStep1">
      <div class="form-stack">
        <div class="field">
          <label>手机号</label>
          <input id="addPhone" maxlength="11" inputmode="numeric" placeholder="请输入中国移动手机号">
        </div>
        <div class="field">
          <label>备注（可选）</label>
          <input id="addRemark" maxlength="30" placeholder="如：主号">
        </div>
        <p class="muted small">点击「发送验证码」后，系统将打开登录页并自动填写手机号</p>
      </div>
      <div class="modal-btns">
        <button class="btn" onclick="closeAddModal()">取消</button>
        <button class="btn primary" id="sendBtn" onclick="startLoginFlow()">发送验证码</button>
      </div>
    </div>
    <div id="addStep2" style="display:none">
      <p class="muted small" id="flowStatus">正在启动浏览器...</p>
      <div class="field" style="margin-top:12px">
        <label>短信验证码</label>
        <input id="addCode" maxlength="6" inputmode="numeric" placeholder="请输入收到的验证码">
      </div>
      <div class="modal-btns">
        <button class="btn" id="flowCancelBtn" onclick="cancelLoginFlow()">取消</button>
        <button class="btn primary" id="submitCodeBtn" onclick="submitCode()">提交验证码</button>
      </div>
    </div>
  </div>
</div>

<!-- 修改备注弹窗 -->
<div class="modal-mask" id="editModal" style="display:none">
  <div class="modal">
    <h3>修改备注</h3>
    <div class="form-stack">
      <div class="field">
        <label>手机号</label>
        <input id="editPhone" class="mono" disabled>
      </div>
      <div class="field">
        <label>备注</label>
        <input id="editRemark" maxlength="30" placeholder="如：主号">
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn" onclick="closeEditModal()">取消</button>
      <button class="btn primary" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<!-- 账号详情弹窗 -->
<div class="modal-mask" id="detailModal" style="display:none">
  <div class="modal">
    <h3>账号详情</h3>
    <div id="detailBody"></div>
    <div class="modal-btns detail-btns">
      <div class="detail-ops">
        <button class="btn sm" id="detailReloginBtn" onclick="detailRelogin()">重新登录</button>
        <button class="btn sm" id="detailEditBtn" onclick="detailEdit()">修改</button>
        <button class="btn sm danger" id="detailDelBtn" onclick="detailDelete()">删除</button>
      </div>
      <button class="btn" onclick="closeDetailModal()">关闭</button>
    </div>
  </div>
</div>

<!-- 删除账号弹窗（二次确认） -->
<div class="modal-mask" id="delModal" style="display:none">
  <div class="modal">
    <h3>删除账号</h3>
    <p>确认删除账号 <b class="mono" id="delTarget"></b> 吗？</p>
    <p class="muted small" style="margin-top:8px">将同时删除该账号的登录状态与本地查询数据，操作不可恢复。</p>
    <div class="modal-btns">
      <button class="btn" onclick="closeDelModal()">取消</button>
      <button class="btn danger" onclick="confirmDelete()">确认删除</button>
    </div>
  </div>
</div>

<script>
function getCookie(name) {
  const m = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
  return m ? m[2] : '';
}
async function api(url, opts = {}) {
  opts.headers = Object.assign({ 'X-CSRF-Token': getCookie('cm_csrf') }, opts.headers || {});
  if (opts.body && typeof opts.body === 'object') {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  const r = await fetch(url, opts);
  const j = await r.json().catch(() => ({ ok: false, error: '响应解析失败' }));
  return j;
}

// ---------- 账号列表 ----------
let pollingTimer = null;
const revealedPhones = new Set();

function maskPhone(p) { return p.slice(0, 3) + '****' + p.slice(7); }

async function loadAccounts() {
  const j = await api('/api/accounts');
  if (!j.ok) {
    if (j.error === '未登录') { location.href = '/login'; return; }
    showError(j.error);
    return;
  }
  const tbody = document.getElementById('accBody');
  const list = j.accounts || [];
  document.getElementById('emptyTip').style.display = list.length ? 'none' : 'block';
  document.getElementById('listCard').style.display = list.length ? 'block' : 'none';
  tbody.innerHTML = '';
  for (const a of list) tbody.appendChild(renderRow(a));
}

function statusBadge(a) {
  const badge = document.createElement('span');
  if (!a.has_login_state) { badge.className = 'badge off'; badge.textContent = '未登录'; }
  else if (a.last_query === '') { badge.className = 'badge run'; badge.textContent = '待查询'; }
  else if (a.last_ok) { badge.className = 'badge ok'; badge.textContent = '正常'; }
  else { badge.className = 'badge err'; badge.textContent = '查询失败'; }
  if (a.last_error) badge.title = a.last_error;
  return badge;
}

function renderRow(a) {
  const tr = document.createElement('tr');

  // 备注
  const tdRemark = document.createElement('td');
  if (a.remark) tdRemark.textContent = a.remark;
  else { tdRemark.textContent = '—'; tdRemark.className = 'muted'; }
  tr.appendChild(tdRemark);

  // 手机号码（中间四位脱敏，点击查看/隐藏）
  const tdPhone = document.createElement('td');
  const pbtn = document.createElement('button');
  pbtn.className = 'phone-toggle mono';
  const applyMask = () => {
    const revealed = revealedPhones.has(a.phone);
    pbtn.textContent = revealed ? a.phone : maskPhone(a.phone);
    pbtn.title = revealed ? '点击隐藏中间四位' : '点击查看完整号码';
  };
  applyMask();
  pbtn.onclick = () => {
    if (revealedPhones.has(a.phone)) revealedPhones.delete(a.phone);
    else revealedPhones.add(a.phone);
    applyMask();
  };
  tdPhone.appendChild(pbtn);
  tr.appendChild(tdPhone);

  // 状态
  const tdStatus = document.createElement('td');
  tdStatus.appendChild(statusBadge(a));
  tr.appendChild(tdStatus);

  // 余额
  const tdBal = document.createElement('td');
  if (a.result && a.result.balance) tdBal.textContent = a.result.balance;
  else { tdBal.textContent = '—'; tdBal.className = 'muted'; }
  tr.appendChild(tdBal);

  // 通用流量 / 语音
  tr.appendChild(usageTd(a.result && a.result.general_flow));
  tr.appendChild(usageTd(a.result && a.result.voice));

  // 查询时间
  const tdTime = document.createElement('td');
  tdTime.className = 'muted small';
  tdTime.textContent = a.last_query || '从未查询';
  tr.appendChild(tdTime);

  // 操作
  const tdOps = document.createElement('td');
  const ops = document.createElement('span');
  ops.className = 'row-ops';
  const qBtn = mkBtn('查询', () => queryOne(a.phone));
  qBtn.disabled = !a.has_login_state;
  if (!a.has_login_state) qBtn.title = '尚未登录，请先完成登录';
  ops.appendChild(qBtn);
  ops.appendChild(mkBtn('查看详情', () => openDetailModal(a)));
  tdOps.appendChild(ops);
  tr.appendChild(tdOps);

  return tr;
}

function mkBtn(text, fn, cls) {
  const b = document.createElement('button');
  b.className = 'btn sm' + (cls ? ' ' + cls : '');
  b.textContent = text;
  b.onclick = fn;
  return b;
}

function usageTd(u) {
  const td = document.createElement('td');
  if (!u || (!u.used && !u.total)) { td.textContent = '—'; td.className = 'muted'; return td; }
  const used = document.createElement('span');
  used.textContent = u.used || '—';
  const total = document.createElement('span');
  total.className = 'muted';
  total.textContent = ' / ' + (u.total || '—');
  td.appendChild(used);
  td.appendChild(total);
  td.title = '已用 ' + (u.used || '—') + ' / 总量 ' + (u.total || '—');
  return td;
}

function showError(msg) {
  const el = document.getElementById('pageError');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 5000);
}

// ---------- 查询 ----------
async function queryAll() {
  const j = await api('/api/query/all', { method: 'POST' });
  if (!j.ok) { showError(j.error); return; }
  startPolling();
}
async function queryOne(phone) {
  const j = await api('/api/query/one', { method: 'POST', body: { phone } });
  if (!j.ok) { showError(j.error); return; }
  startPolling();
}
function startPolling() {
  const banner = document.getElementById('queryBanner');
  banner.style.display = 'block';
  banner.textContent = '查询进行中，浏览器正在访问网上营业厅（每个号码约 15~30 秒）...';
  document.getElementById('queryAllBtn').disabled = true;
  if (pollingTimer) return;
  pollingTimer = setInterval(async () => {
    const j = await api('/api/query/status');
    await loadAccounts();
    if (j.ok && !j.running) {
      clearInterval(pollingTimer);
      pollingTimer = null;
      banner.style.display = 'none';
      document.getElementById('queryAllBtn').disabled = false;
    }
  }, 3000);
}

// ---------- 添加账号（登录流程） ----------
let flowTimer = null;
let flowPhone = '';
function openAddModal(phone) {
  closeAddModal();
  document.getElementById('addModal').style.display = 'flex';
  document.getElementById('addStep1').style.display = 'block';
  document.getElementById('addStep2').style.display = 'none';
  document.getElementById('addPhone').value = phone || '';
  document.getElementById('addRemark').value = '';
  document.getElementById('addCode').value = '';
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('submitCodeBtn').disabled = false;
  document.getElementById('submitCodeBtn').style.display = '';
  document.getElementById('flowCancelBtn').textContent = '取消';
  document.querySelectorAll('#addStep2 .flow-end-btn').forEach(b => b.remove());
}
function closeAddModal() {
  document.getElementById('addModal').style.display = 'none';
  if (flowTimer) { clearInterval(flowTimer); flowTimer = null; }
}
async function startLoginFlow() {
  const phone = document.getElementById('addPhone').value.trim();
  const remark = document.getElementById('addRemark').value.trim();
  if (!/^1\d{10}$/.test(phone)) { alert('请输入正确的 11 位手机号'); return; }
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  btn.textContent = '发送中...';
  const j = await api('/api/login-flow/start', { method: 'POST', body: { phone, remark } });
  btn.disabled = false;
  btn.textContent = '发送验证码';
  if (!j.ok) { showError(j.error); return; }
  flowPhone = phone;
  document.getElementById('addStep1').style.display = 'none';
  document.getElementById('addStep2').style.display = 'block';
  document.getElementById('flowStatus').textContent = '正在启动浏览器...';
  document.getElementById('addCode').value = '';
  pollFlow();
}
function pollFlow() {
  if (flowTimer) clearInterval(flowTimer);
  flowTimer = setInterval(async () => {
    const j = await api('/api/login-flow/status');
    if (!j.ok) { clearInterval(flowTimer); flowTimer = null; return; }
    if (!j.active) {
      // 登录会话已结束：按结束原因提示，避免弹窗停在旧状态
      clearInterval(flowTimer); flowTimer = null;
      if (j.stage === 'success') { flowDone(); return; }
      flowEnded(j);
      return;
    }
    const el = document.getElementById('flowStatus');
    el.textContent = j.stage_text + (j.msg && j.msg !== j.stage_text ? '：' + j.msg : '');
    const done = j.stage === 'success' || j.stage === 'error' || j.stage === 'closed';
    document.getElementById('submitCodeBtn').disabled = done || j.stage === 'submitting';
    if (j.stage === 'success') {
      clearInterval(flowTimer); flowTimer = null;
      flowDone();
    }
  }, 1500);
}
// 登录成功后的弹窗状态：短暂展示后自动关闭并查询该号码
function flowDone() {
  const el = document.getElementById('flowStatus');
  el.textContent = '✓ 登录成功，登录态已保存，即将自动查询...';
  document.getElementById('flowCancelBtn').textContent = '关闭';
  const phone = flowPhone;
  setTimeout(() => {
    closeAddModal();
    loadAccounts();
    queryOne(phone); // 自动查询刚登录的号码，查询进度见顶部横幅
  }, 1200);
}
// 会话非成功结束后的弹窗状态（区分浏览器关闭场景，给出对应指引）
function flowEnded(j) {
  const el = document.getElementById('flowStatus');
  let text;
  if (j.stage === 'closed') {
    // msg 已按场景区分：已提交验证码（登录态可能已保存）/ 未提交（需重新登录）
    text = '浏览器窗口已关闭：' + (j.msg || '登录结果未确认');
  } else {
    const reason = j.stage_text ? j.stage_text + (j.msg && j.msg !== j.stage_text ? '：' + j.msg : '') : '';
    text = '登录会话已结束' + (reason ? '：' + reason : '，请重新发起登录');
  }
  el.textContent = text;
  if (j.stage === 'closed' && j.submitted) {
    // 验证码已提交，Cookie 通常已保存：查询一次即可确认登录是否成功
    setFlowEndBtns([
      { text: '查询验证', primary: true, fn: () => { closeAddModal(); queryOne(flowPhone); } },
      { text: '重新登录', fn: () => { closeAddModal(); openAddModal(flowPhone); } }
    ]);
  } else {
    setFlowEndBtns([{ text: '重新登录', primary: true, fn: () => { closeAddModal(); openAddModal(flowPhone); } }]);
  }
  document.getElementById('flowCancelBtn').textContent = '关闭';
}
function setFlowEndBtns(defs) {
  document.getElementById('submitCodeBtn').style.display = 'none';
  const btns = document.querySelector('#addStep2 .modal-btns');
  btns.querySelectorAll('.flow-end-btn').forEach(b => b.remove());
  for (const d of defs) {
    const b = document.createElement('button');
    b.className = 'btn flow-end-btn' + (d.primary ? ' primary' : '');
    b.textContent = d.text;
    b.onclick = d.fn;
    btns.appendChild(b);
  }
}
async function submitCode() {
  const code = document.getElementById('addCode').value.trim();
  if (!/^\d{4,8}$/.test(code)) { alert('请输入收到的验证码'); return; }
  document.getElementById('submitCodeBtn').disabled = true;
  const j = await api('/api/login-flow/code', { method: 'POST', body: { code } });
  if (!j.ok) {
    document.getElementById('submitCodeBtn').disabled = false;
    showError(j.error);
    return;
  }
  document.getElementById('flowStatus').textContent = '验证码已提交，等待登录完成...';
}
async function cancelLoginFlow() {
  await api('/api/login-flow/cancel', { method: 'POST' });
  closeAddModal();
  loadAccounts();
}

// ---------- 修改备注 ----------
function openEditModal(a) {
  document.getElementById('editModal').style.display = 'flex';
  document.getElementById('editPhone').value = a.phone;
  document.getElementById('editRemark').value = a.remark || '';
}
function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }
async function saveEdit() {
  const phone = document.getElementById('editPhone').value;
  const remark = document.getElementById('editRemark').value.trim();
  const j = await api('/api/accounts/edit', { method: 'POST', body: { phone, remark } });
  if (!j.ok) { showError(j.error); return; }
  closeEditModal();
  loadAccounts();
}

// ---------- 查看详情 ----------
let detailAccount = null;
function openDetailModal(a) {
  detailAccount = a;
  const body = document.getElementById('detailBody');
  body.innerHTML = '';

  const head = document.createElement('div');
  head.className = 'detail-head';
  const phoneEl = document.createElement('span');
  phoneEl.className = 'mono detail-phone';
  phoneEl.textContent = a.phone;
  head.appendChild(phoneEl);
  if (a.remark) {
    const r = document.createElement('span');
    r.className = 'remark-pill';
    r.textContent = a.remark;
    head.appendChild(r);
  }
  head.appendChild(statusBadge(a));
  body.appendChild(head);

  const meta = document.createElement('div');
  meta.className = 'detail-meta muted small';
  meta.textContent = '上次查询：' + (a.last_query || '从未查询');
  body.appendChild(meta);

  if (a.last_error) {
    const err = document.createElement('div');
    err.className = 'alert error';
    err.textContent = '最近一次查询失败：' + a.last_error;
    body.appendChild(err);
  }

  const lines = document.createElement('div');
  lines.className = 'detail-lines';
  if (!a.lines || a.lines.length <= 1) {
    const p = document.createElement('div');
    p.className = 'muted';
    p.textContent = a.has_login_state ? '暂无查询结果，可在列表中点击「查询」获取' : '尚未登录，点击下方「去登录」完成短信验证';
    lines.appendChild(p);
  } else {
    // lines[0] 为「手机号：xxx」，头部已展示，跳过
    for (const line of a.lines.slice(1)) {
      const div = document.createElement('div');
      div.className = 'line';
      const idx = line.indexOf('：');
      if (idx > 0) {
        const b = document.createElement('b');
        b.textContent = line.slice(0, idx + 1).trim() + ' ';
        div.appendChild(b);
        div.appendChild(document.createTextNode(line.slice(idx + 1).trim()));
      } else {
        div.textContent = line.trim();
      }
      div.title = line.trim();
      lines.appendChild(div);
    }
  }
  body.appendChild(lines);

  document.getElementById('detailReloginBtn').textContent = a.has_login_state ? '重新登录' : '去登录';
  document.getElementById('detailModal').style.display = 'flex';
}
function closeDetailModal() { document.getElementById('detailModal').style.display = 'none'; }
function detailRelogin() {
  if (!detailAccount) return;
  closeDetailModal();
  openAddModal(detailAccount.phone);
}
function detailEdit() {
  if (!detailAccount) return;
  closeDetailModal();
  openEditModal(detailAccount);
}
function detailDelete() {
  if (!detailAccount) return;
  closeDetailModal();
  openDelModal(detailAccount);
}

// ---------- 删除（二次确认） ----------
let delAccount = null;
function openDelModal(a) {
  delAccount = a;
  document.getElementById('delTarget').textContent = a.remark ? a.remark + '（' + a.phone + '）' : a.phone;
  document.getElementById('delModal').style.display = 'flex';
}
function closeDelModal() { document.getElementById('delModal').style.display = 'none'; }
async function confirmDelete() {
  const j = await api('/api/accounts/delete', { method: 'POST', body: { phone: delAccount.phone } });
  if (!j.ok) { showError(j.error); return; }
  closeDelModal();
  loadAccounts();
}

document.addEventListener('DOMContentLoaded', () => {
  loadAccounts();
  // 定时刷新（60s 静默刷新，查询轮询除外）
  setInterval(() => { if (!pollingTimer) loadAccounts(); }, 60000);
});
</script>
{{template "footer" .}}
