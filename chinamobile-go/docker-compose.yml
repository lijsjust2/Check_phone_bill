services:
  chinamobile-monitor:
    image: chinamobile-monitor:latest
    build: .
    container_name: chinamobile-monitor
    restart: unless-stopped
    ports:
      - "10086:10086"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
    # Chromium 共享内存，避免页面崩溃（默认 64M 偏小）
    shm_size: 512m
