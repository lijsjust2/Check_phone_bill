{{define "header"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} - 移动监控</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
{{if .Username}}
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">移动监控</div>
    <nav class="sidebar-nav">
      <a href="/accounts" class="{{if eq .Active "accounts"}}active{{end}}">账号管理</a>
      <a href="/daily" class="{{if eq .Active "daily"}}active{{end}}">费用明细</a>
      <a href="/settings" class="{{if eq .Active "settings"}}active{{end}}">设置</a>
      <a href="/logs" class="{{if eq .Active "logs"}}active{{end}}">日志</a>
    </nav>
    <div class="sidebar-footer">
      <span class="muted small">{{.Username}}</span>
      <form method="post" action="/logout" class="inline">
        <button type="submit" class="link-btn">退出</button>
      </form>
    </div>
  </aside>
  <main class="content">
{{end}}{{end}}

{{define "footer"}}
{{if .Username}}
  </main>
</div>
{{end}}
</body>
</html>{{end}}
